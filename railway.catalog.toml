"$schema" = "https://railway.com/railway.schema.json"

[build]
builder = "RAILPACK"
buildCommand = "pnpm install --frozen-lockfile"

[deploy]
startCommand = "pnpm cron -- --stages embed,store,upsert"
# Daily at 02:00 UTC; use a manual run to catch up first.
cronSchedule = "0 2 * * *"
restartPolicyType = "NEVER"
