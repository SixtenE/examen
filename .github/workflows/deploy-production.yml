name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    container: ghcr.io/railwayapp/cli:5.30.3
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
    steps:
      - name: Check out verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate deployment configuration
        run: |
          test -n "$RAILWAY_TOKEN" || { echo "::error::RAILWAY_TOKEN is not configured"; exit 1; }
          test -n "$RAILWAY_SERVICE_ID" || { echo "::error::RAILWAY_SERVICE_ID is not configured"; exit 1; }

      - name: Deploy to Railway
        run: railway up --ci --service "$RAILWAY_SERVICE_ID"
